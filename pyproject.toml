[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quil"
version = "0.1.0"
description = "Harness engineering CLI"
requires-python = ">=3.10"
dependencies = [
    "click",
    "pre-commit>=4.6.0",
]

[project.scripts]
quil = "quil.orchestrator:cli"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",
  "ANN",
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "D105",
  "D106",
  "D107",
  "D203",
  "D211",
  "D213",
  "FIX002",
  "RET504",
  "TD003",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "ARG001"]
"tests/**" = ["S101", "ARG001"]
"conftest.py" = ["S101"]

[tool.ruff.format]
skip-magic-trailing-comma = false
